[project]
name = "mvv-delay-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pia Baronetzky", email = "pia@baronetzky.org" }
]
requires-python = ">=3.10"
dependencies = [
    "branca>=0.8.2",
    "folium>=0.20.0",
    "gtfs-realtime-bindings>=2.2.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
]

[project.scripts]
mvv-delay-tracker = "mvv_delay_tracker:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "nbformat>=5.11.1",
]
