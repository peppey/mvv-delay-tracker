name: Update static GTFS data

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Get static GTFS version
        id: gtfs
        run: |
          headers="$(curl --fail --silent --show-error --head https://download.gtfs.de/germany/nv_free/latest.zip)"
          etag="$(printf '%s\n' "$headers" | awk -F': ' 'tolower($1) == "etag" {print $2}' | tr -d '\r"')"
          last_modified="$(printf '%s\n' "$headers" | awk -F': ' 'tolower($1) == "last-modified" {print $2}' | tr -d '\r')"
          version="${etag:-$last_modified}"
          version="$(printf '%s' "$version" | sed 's/[^A-Za-z0-9._-]/-/g')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore static GTFS cache
        uses: actions/cache@v4
        with:
          path: |
            data/static/stop_times.txt
            data/static/calendar.txt
            data/static/calendar_dates.txt
          key: gtfs-${{ steps.gtfs.outputs.version }}
          restore-keys: |
            gtfs-

      - name: Update static GTFS data
        run: uv run python scripts/update_static_data.py
        env:
          KEEP_TEMPORARY_STATIC_FILES: "true"

      - name: Check realtime departure data quality
        run: uv run python scripts/check_realtime_data_quality.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/static/.gtfs_metadata.json data/static/agency.txt data/static/routes.txt data/static/trips.txt data/static/munich_stops.csv
          git add data/quality/realtime_departure_failures.csv
          git add data/quality/munich_trip_completeness.csv
          git add docs/munich_trip_completeness.png
          git diff --cached --quiet || git commit -m "Update static GTFS data"
          git push
