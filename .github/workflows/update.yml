name: Update MVV data

on:
  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:

permissions:
  contents: write


jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Update MVV data
        run: uv run python scripts/update_parquet.py

      - name: Update README access date
        run: |
          python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          import re

          readme_path = Path("README.md")
          readme = readme_path.read_text()
          current_date = datetime.now().strftime("%B %Y")
          updated_readme = re.sub(
              r"^\*\*Last accessed:\*\* .*$",
              f"**Last accessed:** {current_date}",
              readme,
              flags=re.MULTILINE,
          )
          readme_path.write_text(updated_readme)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/realtime/mvv_realtime.parquet
          git add docs/munich_delay_statistics.png
          git add docs/munich_delays.png
          git add -f docs/delay_comparison.png
          git add -f docs/line_comparison.png
          git add -f docs/delay_heatmap.png
          git add README.md

          git diff --cached --quiet || git commit -m "Update MVV data and plot"

          git push