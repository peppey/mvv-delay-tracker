name: Deploy MVV Delay Tracker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  PROJECT_ID: mvv-delay-tracker
  REGION: europe-west3
  REPOSITORY: mvv-delay-tracker
  IMAGE: europe-west3-docker.pkg.dev/mvv-delay-tracker/mvv-delay-tracker/app

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/429802907181/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-actions-sa@mvv-delay-tracker.iam.gserviceaccount.com"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Ensure Artifact Registry repository exists
        run: |
          gcloud artifacts repositories describe "${REPOSITORY}" \
            --location "${REGION}" \
            --project "${PROJECT_ID}" \
            >/dev/null 2>&1 || \
          gcloud artifacts repositories create "${REPOSITORY}" \
            --repository-format docker \
            --location "${REGION}" \
            --project "${PROJECT_ID}"

      - name: Build and push image
        run: |
          docker build --tag "${IMAGE}:${GITHUB_SHA}" .
          docker push "${IMAGE}:${GITHUB_SHA}"

      - name: Deploy Cloud Run jobs
        run: |
          for job_config in "realtime-update:realtime" "static-update:static"; do
            job="${job_config%%:*}"
            job_type="${job_config##*:}"
            gcloud run jobs deploy "$job" \
              --image "${IMAGE}:${GITHUB_SHA}" \
              --region "${REGION}" \
              --service-account "mvv-delay-tracker-runtime@${PROJECT_ID}.iam.gserviceaccount.com" \
              --set-env-vars "MVV_JOB_TYPE=${job_type},MVV_DATA_BUCKET=mvv-delay-tracker-data,GITHUB_REPOSITORY=peppey/mvv-delay-tracker" \
              --set-secrets "GITHUB_TOKEN=github-repo-token:latest"
          done